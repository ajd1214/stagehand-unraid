# Stagehand for Unraid - configuration
# Plain bash KEY="value" lines. Defaults below are set for DENNAS.
# Lines marked [advanced] can usually be left alone.

########## Master controls ##########
# "yes" to run at all. "no" makes every run exit immediately.
ENABLED="yes"
# "yes" = log what WOULD happen; never copy, switch, delete or edit files.
DRY_RUN="yes"
# If this file exists, every run exits immediately (one-command kill switch).
KILL_FILE="/boot/config/plugins/stagehand/DISABLE"

########## Where things live ##########
# State and log live off the flash drive to avoid USB wear.
STATE_DIR="/mnt/user/appdata/stagehand"
LOG_FILE="/mnt/user/appdata/stagehand/stagehand.log"
LOG_MAX_MB="5"
# Also send log lines to syslog (tag "stagehand").
SYSLOG="yes"
# Unraid notifications: none | errors | all
NOTIFY="errors"

########## What to cache ##########
# Target SSD pool (name as in /mnt/<pool>).
POOL="cache_media"
# User shares Stagehand is allowed to work on.
SHARES="data_tv data_movies"
# Only files whose path contains one of these folder names (space separated).
SUBFOLDERS="movies_main movies_request movies_temp tv_main tv_lifestyle tv_request tv_talk tv_docs tv_news"
# Skip files whose path contains any of these (space separated).
EXCLUSIONS="_requests_display .Recycle.Bin recycle_bin"
# Media file extensions (no dots, space separated).
FILETYPES="mkv mp4 m4v avi ts"
# Seconds a title must be seen playing before it is copied (skips previews and browsing).
WAIT_SECONDS="60"
# After the playing episode, also copy this many following episodes from the same season.
NEXT_EPISODES="1"

########## Live switch ##########
# switch = live switch playback to the SSD copy (gdb)
# close  = close the array file; the player restarts on the SSD copy
# none   = copy only, no switch
SWITCH_MODE="switch"
# Abort a gdb switch that takes longer than this (seconds). [advanced]
GDB_TIMEOUT_SECONDS="10"

########## Keep hours (release rules) ##########
# Default hours a cached copy is kept after it was last played.
KEEP_HOURS="24"
# Per-folder overrides, "folder:hours" space separated. First match wins.
KEEP_RULES="tv_main:144 tv_lifestyle:144 tv_request:144 tv_talk:144 tv_docs:144 tv_news:144"
# How to prove the array copy is identical before deleting the pool copy:
# size = same name and same size (fast)   cmp = full byte compare (slow, strongest)
RELEASE_VERIFY="size"

########## Pool safety ##########
# Never copy if the pool would drop below this much free space (GB).
MIN_FREE_GB="150"
# Skip copying if the pool reports btrfs/zfs errors or is read-only.
HEALTH_CHECK="yes"
# Max GB copied per run (playing file always allowed; limits next-episode copies). [advanced]
MAX_COPY_GB_PER_RUN="60"
# rsync bandwidth limit in KB/s for copies, 0 = unlimited. [advanced]
COPY_BWLIMIT_KBPS="0"

########## Media server ##########
# plex | jellyfin | emby   (jellyfin and emby are experimental)
MEDIASERVER_TYPE="plex"
MEDIASERVER_URL="http://127.0.0.1:32400"
# Plex: "auto" reads the token from the Plex container's Preferences.xml.
# Jellyfin/Emby: paste an API key.
MEDIASERVER_TOKEN="auto"
# Container name of the media server (used for "auto" token and path mapping).
MEDIASERVER_CONTAINER="plex"
# Path mapping from media-server paths to host paths:
# "auto" = read the container's volume mounts with docker inspect.
# Manual = "container_path:host_path" pairs, space separated, e.g. "/tv:/mnt/user/data_tv".
PATH_MAP="auto"

########## Mover Tuning ##########
# Keep cached files out of Mover Tuning's way by managing a marked block
# in its ignore file. Your own entries outside the block are never touched.
MANAGE_MOVER_IGNORE="yes"
MOVER_IGNORE_FILE="/mnt/user/system/mover/mover_ignore.txt"
MOVER_TUNING_CFG="/boot/config/plugins/ca.mover.tuning/ca.mover.tuning.cfg"

########## Advanced: sources and pools ##########
# Where original files live. "auto" = Unraid array disks /mnt/disk1../mnt/diskN.
# Or space separated roots, e.g. "/mnt/disk1 /mnt/disk2 /mnt/disks/MyUD". [advanced]
SOURCE_ROOTS="auto"
# Allow a target pool that is not the share's own primary pool. Experimental:
# Unraid may not serve that copy on later opens. [advanced]
ALLOW_OTHER_POOL="no"
