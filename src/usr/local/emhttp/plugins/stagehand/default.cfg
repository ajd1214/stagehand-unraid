# Stagehand for Unraid - configuration
# Plain bash KEY="value" lines. Defaults below are set for DENNAS.
# Lines marked [advanced] can usually be left alone.

########## Master controls ##########
# "yes" to run at all. "no" makes every run exit immediately.
ENABLED="yes"
# "yes" = log what WOULD happen; never copy, switch, delete or edit files.
DRY_RUN="yes"
# Run automatically on a schedule. "no" = only when run by hand.
SCHEDULE="no"
# Cron times for the copy/switch cycle and the release (clean) cycle.
RUN_CRON="* * * * *"
CLEAN_CRON="17 * * * *"
# If this file exists, every run exits immediately (one-command kill switch).
KILL_FILE="/boot/config/plugins/stagehand/DISABLE"

########## Where things live ##########
# State and log live off the flash drive to avoid USB wear.
STATE_DIR="/mnt/user/appdata/stagehand"
LOG_FILE="/mnt/user/appdata/stagehand/stagehand.log"
LOG_MAX_MB="5"
# Also send log lines to syslog (tag "stagehand").
SYSLOG="yes"
# Unraid notifications: none | errors | all
NOTIFY="errors"

########## What to cache ##########
# Target SSD pool (name as in /mnt/<pool>).
POOL="cache_media"
# User shares Stagehand is allowed to work on.
SHARES="data_tv data_movies"
# Only files whose path contains one of these folder names (space separated).
SUBFOLDERS="movies_main movies_request movies_temp tv_main tv_lifestyle tv_request tv_talk tv_docs tv_news"
# Skip files whose path contains any of these (space separated).
EXCLUSIONS="_requests_display .Recycle.Bin recycle_bin"
# Media file extensions (no dots, space separated).
FILETYPES="mkv mp4 m4v avi ts"
# Seconds a title must be seen playing before it is copied (skips previews and browsing).
WAIT_SECONDS="60"
# What else to copy when an episode plays:
#   0 = only the playing file   N = the next N episodes
#   rest = every later episode in the folder   season = the whole season folder
NEXT_EPISODES="1"
# A file counts as an episode when its name matches this pattern (S01E02 style), or its
# folder is named Season/Specials/Staffel/Saison/Temporada/Stagione/Seizoen. [advanced]
NEXT_EPISODE_REGEX="[Ss][0-9]+[Ee][0-9]+"
# Also copy subtitle files named like the video (Show.S01E01.en.srt).
COPY_SIDECARS="yes"
SIDECAR_TYPES="srt ass ssa sub idx vtt sup"

########## Live switch ##########
# switch = live switch playback to the SSD copy (gdb)
# close  = close the array file; the player restarts on the SSD copy
# none   = copy only, no switch
SWITCH_MODE="switch"
# Abort a gdb switch that takes longer than this (seconds). [advanced]
GDB_TIMEOUT_SECONDS="10"

########## Keep hours (release rules) ##########
# Default hours a cached copy is kept after it was last played.
KEEP_HOURS="24"
# Per-folder overrides, "folder:hours" space separated. First match wins.
KEEP_RULES="tv_main:144 tv_lifestyle:144 tv_request:144 tv_talk:144 tv_docs:144 tv_news:144"
# How to prove the array copy is identical before deleting the pool copy:
# size = same name and same size (fast)   cmp = full byte compare (slow, strongest)
RELEASE_VERIFY="size"
# After releasing a copy, remove pool folders it leaves empty (never touches the array).
CLEAN_EMPTY_DIRS="yes"

########## Pool safety ##########
# Never copy if the pool would drop below this much free space (GB).
MIN_FREE_GB="150"
# A read-only pool always stops copying. These two add optional stops:
# NEW filesystem errors (btrfs/zfs counters going up) and kernel disk I/O errors in the log,
# each blocking copies for IO_ERROR_WINDOW_MIN minutes after the error.
SKIP_ON_FS_ERRORS="yes"
SKIP_ON_IO_ERRORS="yes"
IO_ERROR_WINDOW_MIN="60"
# Max GB copied per run (playing file always allowed; limits next-episode copies). [advanced]
MAX_COPY_GB_PER_RUN="60"
# rsync bandwidth limit in KB/s for copies, 0 = unlimited. [advanced]
COPY_BWLIMIT_KBPS="0"

########## Media server ##########
# plex | jellyfin | emby   (jellyfin and emby are experimental)
MEDIASERVER_TYPE="plex"
MEDIASERVER_URL="http://127.0.0.1:32400"
# Plex: "auto" reads the token from the Plex container's Preferences.xml.
# Jellyfin/Emby: paste an API key.
MEDIASERVER_TOKEN="auto"
# Container name of the media server (used for "auto" token and path mapping).
MEDIASERVER_CONTAINER="plex"
# Path mapping from media-server paths to host paths:
# "auto" = read the container's volume mounts with docker inspect.
# Manual = "server_path=>host_path" pairs separated by ";". Spaces, Windows drive letters
# and backslashes are fine, e.g. "/tv=>/mnt/user/data_tv; Z:\TV Shows=>/mnt/user/data_tv".
# Host paths must be under /mnt/user, or live switching cannot work.
PATH_MAP="auto"

# Optional second and third media server (for example Jellyfin next to Plex).
# TYPE none = off. Same meaning as the settings above.
MEDIASERVER2_TYPE="none"
MEDIASERVER2_URL=""
MEDIASERVER2_TOKEN=""
MEDIASERVER2_CONTAINER=""
PATH_MAP2="auto"
MEDIASERVER3_TYPE="none"
MEDIASERVER3_URL=""
MEDIASERVER3_TOKEN=""
MEDIASERVER3_CONTAINER=""
PATH_MAP3="auto"

########## Mover Tuning ##########
# Keep cached files out of Mover Tuning's way by managing a marked block
# in its ignore file. Your own entries outside the block are never touched.
MANAGE_MOVER_IGNORE="yes"
MOVER_IGNORE_FILE="/mnt/user/system/mover/mover_ignore.txt"
MOVER_TUNING_CFG="/boot/config/plugins/ca.mover.tuning/ca.mover.tuning.cfg"

########## Leftover (orphan) files ##########
# When a cached title is deleted, upgraded or renamed through /mnt/user (Sonarr, Radarr,
# Maintainerr, by hand), Unraid removes only the pool copy and the OLD array copy reappears.
# Every clean run asks Sonarr/Radarr (below) whether they still track that array file:
#   still tracked = it is the real copy (the mover moved it) -> kept
#   folder managed but file no longer tracked = leftover
# report = list leftovers on the Lists tab and log them. Nothing is deleted.
# delete = ALSO DELETE confirmed leftovers from the array. This deletes array files. It only
#          happens when Sonarr/Radarr confirm, Mover Tuning's ignore list is on, the file is
#          unchanged since it was cached, nothing has it open, and ORPHAN_GRACE_MIN has passed.
ORPHAN_ACTION="report"
ORPHAN_GRACE_MIN="30"

########## Sonarr / Radarr (used only to confirm leftovers) ##########
# Up to six instances. TYPE none = slot unused. KEY auto reads the API key from the
# container's config.xml. CONTAINER is the Docker container name (for its folder mappings).
ARR1_TYPE="none"
ARR1_URL=""
ARR1_KEY="auto"
ARR1_CONTAINER=""
ARR2_TYPE="none"
ARR2_URL=""
ARR2_KEY="auto"
ARR2_CONTAINER=""
ARR3_TYPE="none"
ARR3_URL=""
ARR3_KEY="auto"
ARR3_CONTAINER=""
ARR4_TYPE="none"
ARR4_URL=""
ARR4_KEY="auto"
ARR4_CONTAINER=""
ARR5_TYPE="none"
ARR5_URL=""
ARR5_KEY="auto"
ARR5_CONTAINER=""
ARR6_TYPE="none"
ARR6_URL=""
ARR6_KEY="auto"
ARR6_CONTAINER=""

########## Advanced: sources and pools ##########
# Where original files live. "auto" = Unraid array disks /mnt/disk1../mnt/diskN.
# Or space separated roots, e.g. "/mnt/disk1 /mnt/disk2 /mnt/disks/MyUD". [advanced]
SOURCE_ROOTS="auto"
# Allow a target pool that is not the share's own primary pool. Experimental:
# Unraid may not serve that copy on later opens. [advanced]
ALLOW_OTHER_POOL="no"
